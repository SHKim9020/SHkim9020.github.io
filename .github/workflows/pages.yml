name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Verify checked-in Arcade editor
        run: |
          set -euo pipefail
          touch "$GITHUB_WORKSPACE/.nojekyll"
          test -f "$GITHUB_WORKSPACE/arcade-uploader/index.html"
          echo "Using the verified checked-in MakeCode Arcade editor."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
