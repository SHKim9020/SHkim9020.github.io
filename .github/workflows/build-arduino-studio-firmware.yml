name: Build Arduino Studio runtime

on:
  push:
    branches: [main]
    paths:
      - "arduino-studio/firmware/onemaker_runtime/**"
      - ".github/workflows/build-arduino-studio-firmware.yml"
  pull_request:
    paths:
      - "arduino-studio/firmware/onemaker_runtime/**"
      - ".github/workflows/build-arduino-studio-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip arduino firmware]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "Servo"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile UNO and Nano runtime
        run: |
          rm -rf "$RUNNER_TEMP/onemaker-arduino-uno" "$RUNNER_TEMP/onemaker-arduino-nano"
          mkdir -p "$RUNNER_TEMP/onemaker-arduino-uno" "$RUNNER_TEMP/onemaker-arduino-nano"
          arduino-cli compile \
            --clean \
            --fqbn "arduino:avr:uno" \
            --build-property "compiler.c.extra_flags=-mcall-prologues" \
            --build-property "compiler.cpp.extra_flags=-mcall-prologues" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--relax" \
            --output-dir "$RUNNER_TEMP/onemaker-arduino-uno" \
            arduino-studio/firmware/onemaker_runtime
          arduino-cli compile \
            --clean \
            --fqbn "arduino:avr:nano:cpu=atmega328" \
            --build-property "compiler.c.extra_flags=-mcall-prologues" \
            --build-property "compiler.cpp.extra_flags=-mcall-prologues" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--relax" \
            --output-dir "$RUNNER_TEMP/onemaker-arduino-nano" \
            arduino-studio/firmware/onemaker_runtime
          cmp "$RUNNER_TEMP/onemaker-arduino-uno/onemaker_runtime.ino.hex" \
            "$RUNNER_TEMP/onemaker-arduino-nano/onemaker_runtime.ino.hex"
          cp "$RUNNER_TEMP/onemaker-arduino-nano/onemaker_runtime.ino.hex" \
            arduino-studio/firmware/onemaker_runtime.hex
          cp "$RUNNER_TEMP/onemaker-arduino-nano/onemaker_runtime.ino.hex" \
            arduino-studio/firmware/onemaker_runtime-1.1.4.hex

      - name: Verify runtime image
        run: |
          test -s arduino-studio/firmware/onemaker_runtime.hex
          grep -q '^:' arduino-studio/firmware/onemaker_runtime.hex
          cmp arduino-studio/firmware/onemaker_runtime.hex \
            arduino-studio/firmware/onemaker_runtime-1.1.4.hex
          python3 - <<'PY'
          from pathlib import Path

          memory = {}
          upper = 0
          for line in Path("arduino-studio/firmware/onemaker_runtime-1.1.4.hex").read_text().splitlines():
              if not line.startswith(":"):
                  continue
              record = bytes.fromhex(line[1:])
              length = record[0]
              address = (record[1] << 8) | record[2]
              kind = record[3]
              payload = record[4:4 + length]
              if kind == 0:
                  for offset, value in enumerate(payload):
                      memory[upper + address + offset] = value
              elif kind == 4:
                  upper = int.from_bytes(payload, "big") << 16

          start = min(memory)
          image = bytearray(max(memory) - start + 1)
          for address, value in memory.items():
              image[address - start] = value
          assert b"1.1.4" in image, "compiled HEX does not contain runtime version 1.1.4"
          assert b"1.1.3" not in image, "compiled HEX still contains stale runtime version 1.1.3"
          PY

      - name: Upload verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: onemaker-runtime-1.1.4
          path: arduino-studio/firmware/onemaker_runtime-1.1.4.hex
          if-no-files-found: error

      - name: Commit generated firmware
        if: ${{ github.event_name == 'push' }}
        run: |
          git add \
            arduino-studio/firmware/onemaker_runtime.hex \
            arduino-studio/firmware/onemaker_runtime-1.1.4.hex
          if git diff --cached --quiet; then
            echo "Arduino runtime is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Arduino Studio runtime [skip arduino firmware]"
          git push
