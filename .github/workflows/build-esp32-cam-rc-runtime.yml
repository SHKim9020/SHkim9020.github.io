name: Build ESP32-CAM RC runtime

on:
  push:
    branches: [main]
    paths:
      - "esp32-cam-rc-car/firmware/rc_cam_runtime/**"
      - ".github/workflows/build-esp32-cam-rc-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip rc firmware]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install ArduinoJson@7.4.2
          arduino-cli lib install NimBLE-Arduino@1.4.3

      - name: Compile RC camera runtime
        run: |
          rm -rf /tmp/onemaker-rc-cam-build
          mkdir -p /tmp/onemaker-rc-cam-build
          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --output-dir /tmp/onemaker-rc-cam-build \
            esp32-cam-rc-car/firmware/rc_cam_runtime

      - name: Split application image for web installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/onemaker-rc-cam-build/rc_cam_runtime.ino.bin')
          image = source.read_bytes()
          split = 512 * 1024
          assert len(image) > split, f'unexpectedly small application image: {len(image)}'
          output = Path('esp32-cam-rc-car/firmware')
          (output / 'rc-runtime-0.1.16-part-0.bin').write_bytes(image[:split])
          (output / 'rc-runtime-0.1.16-part-1.bin').write_bytes(image[split:])
          assert b'OneMaker-RC-' in image
          assert b'data-frame="QVGA"' in image
          assert b'id="blockMode"' in image
          assert b'Runtime 0.1.16' in image
          assert b'FACE_MODEL_B64' in image
          assert 'AI 얼굴 회피'.encode() in image
          assert b'/api/face' in image
          assert b'faceAvoid' in image
          assert '얼굴인식 블록 실행'.encode() in image
          assert b'OneMaker-RC-BLE-' in image
          assert b'6e400001-b5a3-f393-e0a9-e50e24dcca9e' in image
          print(f'application bytes={len(image)}, part0={split}, part1={len(image)-split}')
          PY

      - name: Commit verified RC firmware
        run: |
          git add \
            esp32-cam-rc-car/firmware/rc-runtime-0.1.16-part-0.bin \
            esp32-cam-rc-car/firmware/rc-runtime-0.1.16-part-1.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build ESP32-CAM RC runtime 0.1.16 [skip rc firmware]"
          git push
