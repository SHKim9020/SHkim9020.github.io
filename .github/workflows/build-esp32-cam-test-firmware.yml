name: Build ESP32-CAM camera test firmware

on:
  push:
    branches: [main]
    paths:
      - "esp32-cam-rc-car/firmware/camera_test/**"
      - ".github/workflows/build-esp32-cam-test-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip camera firmware]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile fast camera test
        run: |
          rm -rf /tmp/onemaker-cam-test-build
          mkdir -p /tmp/onemaker-cam-test-build
          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --output-dir /tmp/onemaker-cam-test-build \
            esp32-cam-rc-car/firmware/camera_test

      - name: Split application image for web installer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/onemaker-cam-test-build/camera_test.ino.bin')
          image = source.read_bytes()
          split = 512 * 1024
          assert len(image) > split, f'unexpectedly small application image: {len(image)}'
          output = Path('esp32-cam-rc-car/firmware')
          (output / 'camera-test-0.1.1-part-0.bin').write_bytes(image[:split])
          (output / 'camera-test-0.1.1-part-1.bin').write_bytes(image[split:])
          assert b'OneMaker-CAM-TEST' in image
          assert b'QVGA 320' in image
          print(f'application bytes={len(image)}, part0={split}, part1={len(image)-split}')
          PY

      - name: Commit verified camera firmware
        run: |
          git add \
            esp32-cam-rc-car/firmware/camera-test-0.1.1-part-0.bin \
            esp32-cam-rc-car/firmware/camera-test-0.1.1-part-1.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build fast ESP32-CAM test firmware [skip camera firmware]"
          git push
