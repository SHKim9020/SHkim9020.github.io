name: Build ESP32-C3 Boat firmware

on:
  push:
    branches: [main]
    paths:
      - "esp32-c3-boat/firmware/boat_runtime/**"
      - ".github/workflows/build-esp32-c3-boat-firmware.yml"
  pull_request:
    paths:
      - "esp32-c3-boat/firmware/boat_runtime/**"
      - ".github/workflows/build-esp32-c3-boat-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip firmware]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoJson
          git clone --depth 1 https://github.com/HuskyLens/HUSKYLENSArduino.git /tmp/HUSKYLENSArduino
          sed -i 's/return &send_buffer;/return send_buffer;/' /tmp/HUSKYLENSArduino/HUSKYLENS/HuskyLensProtocolCore.c
          mkdir -p "$HOME/Arduino/libraries"
          cp -R /tmp/HUSKYLENSArduino/HUSKYLENS "$HOME/Arduino/libraries/HUSKYLENS"

      - name: Compile ESP32-C3 runtime
        run: |
          rm -rf /tmp/onemaker-c3-build
          mkdir -p /tmp/onemaker-c3-build
          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=4M,PartitionScheme=huge_app" \
            --output-dir /tmp/onemaker-c3-build \
            esp32-c3-boat/firmware/boat_runtime
          cp /tmp/onemaker-c3-build/boat_runtime.ino.merged.bin \
            esp32-c3-boat/firmware/boat_runtime.merged.bin
          cp /tmp/onemaker-c3-build/boat_runtime.ino.merged.bin \
            esp32-c3-boat/firmware/boat_runtime-1.4.6.merged.bin

      - name: Verify ESP32-C3 runtime
        run: |
          test -s esp32-c3-boat/firmware/boat_runtime.merged.bin
          cmp esp32-c3-boat/firmware/boat_runtime.merged.bin \
            esp32-c3-boat/firmware/boat_runtime-1.4.6.merged.bin
          python3 - <<'PY'
          from pathlib import Path
          image = Path("esp32-c3-boat/firmware/boat_runtime-1.4.6.merged.bin").read_bytes()
          assert b"OneMaker Boat 1.4.6" in image, "runtime 1.4.6 marker is missing"
          assert b"OneMaker Boat 1.4.5" not in image, "stale runtime 1.4.5 marker remains"
          PY

      - name: Upload verified ESP32-C3 runtime
        uses: actions/upload-artifact@v4
        with:
          name: onemaker-boat-runtime-1.4.6
          path: esp32-c3-boat/firmware/boat_runtime-1.4.6.merged.bin
          if-no-files-found: error

      - name: Commit generated firmware
        if: ${{ github.event_name == 'push' }}
        run: |
          git add \
            esp32-c3-boat/firmware/boat_runtime.merged.bin \
            esp32-c3-boat/firmware/boat_runtime-1.4.6.merged.bin
          if git diff --cached --quiet; then
            echo "Firmware is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build ESP32-C3 Boat firmware [skip firmware]"
          git push
